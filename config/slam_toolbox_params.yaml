slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # --- Frames: MUST match this robot ---
    # The default slam_toolbox base_frame is "base_footprint", but our Gazebo
    # DiffDrive publishes "base_link". This mismatch is what caused
    # "Failed to compute odom pose". Point slam at base_link.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # --- Reasonable mapping defaults ---
    resolution: 0.05
    max_laser_range: 12.0          # matches the LiDAR's 12 m range in the SDF
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.3
    transform_publish_period: 0.02 # publishes map->odom at 50 Hz
    map_update_interval: 1.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    debug_logging: false
    throttle_scans: 1